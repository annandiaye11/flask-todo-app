<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier la tâche</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body class="bg-blue-50 min-h-screen p-6">
    <header class="max-w-3xl mx-auto mb-6">
        <nav class="bg-white shadow-md rounded-xl px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-700">Todo App</h1>
            <div class="flex space-x-4">
                <a href="{{ url_for('dashboard') }}" class="text-blue-600 hover:text-blue-800 font-medium">Tableau de bord</a>
                <a href="{{ url_for('manage_categories') }}" class="text-blue-600 hover:text-blue-800 font-medium">Catégories</a>
                <a href="{{ url_for('logout') }}" class="text-red-500 hover:text-red-700 font-medium">Déconnexion</a>
            </div>
        </nav>
    </header>

    <main class="max-w-3xl mx-auto">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="mb-6">
            {% for message in messages %}
            <div class="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 mb-2 rounded" role="alert">
                <p>{{ message }}</p>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Modifier la tâche</h2>
            <form method="POST" action="{{ url_for('edit_task', task_id=task.id) }}">
                <div class="mb-4">
                    <label for="content" class="block text-gray-700 mb-2">Description</label>
                    <input type="text" id="content" name="content" value="{{ task.content }}" required
                           class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label for="due_date" class="block text-gray-700 mb-2">Date d'échéance</label>
                        <input type="date" id="due_date" name="due_date" 
                               value="{% if task.due_date %}{{ task.due_date.strftime('%Y-%m-%d') }}{% endif %}"
                               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300">
                    </div>
                    <div>
                        <label for="priority" class="block text-gray-700 mb-2">Priorité</label>
                        <select id="priority" name="priority"
                                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300">
                            <option value="1" {% if task.priority == 1 %}selected{% endif %}>Haute</option>
                            <option value="2" {% if task.priority == 2 %}selected{% endif %}>Moyenne</option>
                            <option value="3" {% if task.priority == 3 %}selected{% endif %}>Basse</option>
                        </select>
                    </div>
                    <div>
                        <label for="category_id" class="block text-gray-700 mb-2">Catégorie</label>
                        <select id="category_id" name="category_id"
                                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-300">
                            <option value="0">Aucune</option>
                            {% for category in categories %}
                            <option value="{{ category.id }}" {% if task.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button type="submit"
                            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Enregistrer</button>
                    <a href="{{ url_for('dashboard') }}"
                       class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition">Annuler</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="max-w-3xl mx-auto mt-8 text-center text-gray-600 text-sm">
        <p>© {{ now().year }} TodoList App - Tous droits réservés</p>
    </footer>
</body>
</html>
