<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-xl shadow-xl w-full max-w-md space-y-6">
        <h2 class="text-2xl font-bold text-center text-gray-800">Créer un compte</h2>
        <form method="POST" class="space-y-4">
            <input name="username" placeholder="Nom d'utilisateur" required class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            <input name="password" type="password" placeholder="Mot de passe" required class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            <button type="submit" class="w-full bg-green-500 text-white py-2 rounded hover:bg-green-600 transition">S'inscrire</button>
        </form>
        <p class="text-center text-sm text-gray-600">Déjà un compte ? 
            <a href="{{ url_for('login') }}" class="text-blue-600 hover:underline">Se connecter</a>
        </p>
    </div>
</body>
</html>
